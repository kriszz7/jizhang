<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>存钱罐 · 生活费记账</title>
<meta name="description" content="大学生生活费记账与每日存钱计划:实时计算今天还能存下多少钱。">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="存钱罐">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0d9488"/>
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="13" fill="url(#brandGrad)"/>
        <circle cx="20" cy="20" r="12.5" fill="#ffffff"/>
        <g stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" fill="none">
          <path d="M20 14.5v11"/>
          <path d="M15.5 14.5l4.5 5.5M24.5 14.5L20 20"/>
          <path d="M16 20.5h8M15.6 24h8.8"/>
        </g>
      </svg>
      <div>
        <h1 id="topbar-title">今日</h1>
        <p id="topbar-sub"></p>
      </div>
    </div>
    <button class="icon-btn" id="btn-export" title="导出备份" aria-label="导出备份">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v11M7.5 11.5L12 16l4.5-4.5M5 20h14"/>
      </svg>
    </button>
  </header>

  <!-- ===== 视图 ===== -->
  <main class="content">
    <section class="view active" id="view-today"><div id="today-body"></div></section>
    <section class="view" id="view-calendar"><div id="cal-body"></div></section>
    <section class="view" id="view-stats"><div id="stats-body"></div></section>
    <section class="view" id="view-settings"><div id="set-body"></div></section>
  </main>

  <!-- ===== 底部导航 ===== -->
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab active" data-view="today">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></span>
      <span>今日</span>
    </button>
    <button class="tab" data-view="calendar">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3.5"/><path d="M3.5 10h17M8 2.8v4.4M16 2.8v4.4"/></svg></span>
      <span>明细</span>
    </button>
    <button class="tab" data-view="stats">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-6M11 20V8M17 20v-10M3 20h18"/></svg></span>
      <span>统计</span>
    </button>
    <button class="tab" data-view="settings">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span>
      <span>设置</span>
    </button>
  </nav>

  <button class="fab" id="fab" aria-label="记一笔">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- ===== 记账底部弹层 ===== -->
<div class="sheet-mask" id="sheet-mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="记账">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title" id="sheet-title">记一笔</h2>
  <div class="sheet-type" id="sheet-type"></div>
  <div class="amount-row"><span class="cur">¥</span><span class="amount-display" id="sheet-amount">0</span></div>
  <div class="cat-scroll" id="sheet-cats"></div>
  <div class="sheet-fields">
    <label class="field">
      <span>日期</span>
      <input type="date" id="sheet-date">
    </label>
    <label class="field">
      <span>备注</span>
      <input type="text" id="sheet-note" maxlength="100" placeholder="备注(可选)" autocomplete="off">
    </label>
  </div>
  <div class="keypad" id="keypad"></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="sheet-delete" hidden>删除</button>
    <button class="btn primary" id="sheet-save">保存</button>
  </div>
</div>

<!-- ===== 首次引导 ===== -->
<div class="modal-mask" id="onboarding">
  <div class="modal onboarding" id="onboarding-modal">
    <div id="onboard-body"></div>
  </div>
</div>

<!-- ===== 添加到主屏幕引导 ===== -->
<div class="modal-mask" id="install-modal">
  <div class="modal">
    <div class="modal-hero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2.5"/><path d="M12 2.5v8M8.5 5.5L12 2l3.5 3.5"/></svg>
    </div>
    <h3>安装到主屏幕</h3>
    <p class="modal-desc">把「存钱罐」像 App 一样放在 iPhone 主屏幕,全屏使用、断网也能打开:</p>
    <ol class="install-steps">
      <li>点击 Safari 底部中间的<b>分享</b>按钮</li>
      <li>向下滑动,选择<b>「添加到主屏幕」</b></li>
      <li>点右上角<b>「添加」</b>完成</li>
    </ol>
    <button class="btn primary block" id="install-ok">知道了</button>
  </div>
</div>

<!-- ===== 通用确认框 ===== -->
<div class="modal-mask" id="confirm-modal">
  <div class="modal">
    <h3 id="confirm-title">确认</h3>
    <p class="modal-desc" id="confirm-text"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirm-cancel">取消</button>
      <button class="btn danger" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<!-- ===== 通用表单框(目标/分类) ===== -->
<div class="modal-mask" id="form-modal">
  <div class="modal">
    <h3 id="form-title"></h3>
    <div id="form-body"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="form-cancel">取消</button>
      <button class="btn primary" id="form-ok">保存</button>
    </div>
  </div>
</div>

<input type="file" id="import-input" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
